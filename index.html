<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repère Musculation</title>
<meta name="description" content="Programme full body 5 jours, saisie des séries, minuteur de repos et courbes de progression.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repère">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1317" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout : carnet d'entraînement pour téléphone. Une colonne, onglets fixés en bas, minuteur de repos flottant juste au-dessus. Couleurs des disques olympiques : rouge = jour lourd, bleu = jour léger. */
:root{
  --bg:#EDF0F2;
  --surface:#FFFFFF;
  --surface-2:#F4F6F8;
  --ink:#131A21;
  --ink-2:#44515D;
  --ink-3:#66737E;
  --line:#D8DEE3;
  --line-2:#BEC7CF;
  --lourd:#C8332A;
  --lourd-soft:#F7E3E0;
  --leger:#2B62A6;
  --leger-soft:#DEE8F4;
  --on-accent:#FFFFFF;
  --ok:#22744A;
  --ok-soft:#DCEEE3;
  --warn:#8F5A0C;
  --warn-soft:#F5E9D4;
  --danger:#B02A22;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:60px;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1317; --surface:#161D23; --surface-2:#1C252C; --ink:#E9EEF2; --ink-2:#AAB5BF; --ink-3:#86929C;
    --line:#29333B; --line-2:#3A4651; --lourd:#E25A4F; --lourd-soft:#3A201E; --leger:#5A92DC; --leger-soft:#1B2B40;
    --on-accent:#10161B; --ok:#5BC08A; --ok-soft:#173226; --warn:#E3AA52; --warn-soft:#3A2C14; --danger:#F07A70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#161D23; --surface-2:#1C252C; --ink:#E9EEF2; --ink-2:#AAB5BF; --ink-3:#86929C;
  --line:#29333B; --line-2:#3A4651; --lourd:#E25A4F; --lourd-soft:#3A201E; --leger:#5A92DC; --leger-soft:#1B2B40;
  --on-accent:#10161B; --ok:#5BC08A; --ok-soft:#173226; --warn:#E3AA52; --warn-soft:#3A2C14; --danger:#F07A70;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leger);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--leger)}

/* Barre du haut */
.appbar{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.brand b{font-size:20px;font-weight:700}
.brand span{font-size:14px;font-weight:600;color:var(--ink-3)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap;min-width:0}
.status span{overflow:hidden;text-overflow:ellipsis}
.brand{min-width:0}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.status[data-s="saved"] i{background:var(--ok)}
.status[data-s="local"] i{background:var(--warn)}
.status[data-s="pending"] i,.status[data-s="saving"] i{background:var(--leger)}
.status[data-s="error"] i{background:var(--danger)}
.status[data-s="error"]{color:var(--danger)}

/* Contenu */
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--nav-h) + 120px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}

/* Disques (badges de type) */
.plate{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;padding:3px 11px 2px;border-radius:999px;background:var(--ink-3);color:var(--on-accent);white-space:nowrap}
.plate.lourd{background:var(--lourd)}
.plate.leger{background:var(--leger)}
.plate.repos{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.plate.sm{font-size:12px;padding:2px 8px 1px}

/* En-tête du jour */
.day{display:flex;flex-direction:column;gap:12px}
.day-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.day h1{font-size:34px;text-transform:uppercase;letter-spacing:.01em}
.day .date-sub{font-size:13px;color:var(--ink-3);margin-top:4px}
.day-ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);min-height:40px}
.seg button[aria-pressed="true"][data-type="lourd"]{background:var(--lourd);color:var(--on-accent)}
.seg button[aria-pressed="true"][data-type="leger"]{background:var(--leger);color:var(--on-accent)}
.date-in{display:flex;gap:8px;align-items:center}
.date-in input{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:40px;font-size:14px}
.btn-ghost{background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;min-height:40px;font-size:13px;font-weight:600;color:var(--ink-2)}
.hint{font-size:14px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.hint b{color:var(--ink)}

/* Progression de la séance */
.progress{display:flex;flex-direction:column;gap:6px}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.progress-row strong{font-family:var(--f-display);font-size:22px;font-weight:700}
.progress-row span{font-size:13px;color:var(--ink-3)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink-2);border-radius:999px;transition:width .3s ease}
.bar.lourd i{background:var(--lourd)}
.bar.leger i{background:var(--leger)}

/* Carte de préparation */
.setup{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.setup h2{font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.setup ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.setup b{color:var(--ink)}

/* Blocs */
.bloc{display:flex;flex-direction:column;gap:12px}
.bloc-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bloc-n{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.bloc-h h2{font-size:26px;text-transform:uppercase}
.bloc-how{font-size:14px;color:var(--ink-2);max-width:62ch}
.rest-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.chip-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;min-height:38px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;color:var(--ink)}
.chip-btn svg{width:15px;height:15px}
.transition{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border-left:3px solid var(--line-2);padding:4px 0 4px 12px;font-size:14px;color:var(--ink-2)}
.transition b{color:var(--ink)}

/* Exercice */
.exo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.exo-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exo-h h3{font-size:22px;text-transform:uppercase;letter-spacing:.01em}
.exo-meta{font-size:13px;color:var(--ink-2);margin-top:3px}
.exo-meta b{color:var(--ink);font-weight:600}
.count{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink-3);white-space:nowrap}
.count.full{color:var(--ok)}
.cue{font-size:13px;color:var(--ink-3)}
.last{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.last b{color:var(--ink);font-weight:600}
.sugg{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;border-radius:8px;padding:8px 10px;background:var(--surface-2);color:var(--ink-2)}
.sugg.up{background:var(--ok-soft);color:var(--ink)}
.sugg.warn{background:var(--warn-soft);color:var(--ink)}
.sugg .tag{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;margin-right:6px}
.sugg.up .tag{color:var(--ok)}
.sugg.warn .tag{color:var(--warn)}
.sugg button{background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;min-height:34px;font-size:13px;font-weight:600}

.sets{display:grid;grid-template-columns:2.4rem minmax(0,1fr) minmax(0,1fr) 4.6rem;gap:6px 8px;align-items:center}
.sets .hd{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sets .sn{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ink-3)}
.sets input{width:100%;min-width:0;height:46px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);padding:0 10px;font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;color:var(--ink)}
.sets input::placeholder{color:var(--ink-3);opacity:.7}
.sets input:focus{border-color:var(--leger);background:var(--surface)}
.st{font-size:12px;font-weight:600;text-align:center;border-radius:999px;padding:4px 4px;white-space:nowrap;color:var(--ink-3)}
.st.in{background:var(--ok-soft);color:var(--ok)}
.st.over{background:var(--ok-soft);color:var(--ok)}
.st.under{background:var(--warn-soft);color:var(--warn)}

.done-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.done-card strong{font-family:var(--f-display);font-size:20px;color:var(--ink);text-transform:uppercase}

/* Minuteur */
.timer{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);width:min(648px,calc(100% - 2*max(12px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px))));z-index:30;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.timer.end{background:var(--ok);color:var(--on-accent)}
.t-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.t-main{display:flex;align-items:baseline;gap:10px}
.t-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.t-time{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.t-btns{display:flex;gap:6px}
.t-btns button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:6px 10px;min-height:36px;font-size:13px;font-weight:600;opacity:.9}
.t-bar{height:4px;border-radius:999px;background:color-mix(in srgb,currentColor 25%,transparent);overflow:hidden}
.t-bar i{display:block;height:100%;width:100%;background:currentColor}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* Choix de la séance */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.daypick{display:flex;gap:5px;flex-wrap:nowrap}
.daypick button{flex:1 1 0;min-width:0;min-height:40px;padding:0 4px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.daypick button.planned{box-shadow:inset 0 -3px 0 var(--ink-3)}
.daypick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:none}
.exo-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.exo-tags .exo-meta{margin-top:0}
.emom-btn{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.done-card span b{color:var(--ink)}
.pbloc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pbloc li{font-size:13px;color:var(--ink-2)}

/* Progrès */
.section-h{display:flex;flex-direction:column;gap:6px}
.section-h h1{font-size:34px;text-transform:uppercase}
.lede{font-size:14px;color:var(--ink-2);max-width:62ch}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.week-days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.wd .disc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;border:2px dashed var(--line-2);color:var(--ink-3)}
.wd .disc.lourd.done{background:var(--lourd);border:2px solid var(--lourd);color:var(--on-accent)}
.wd .disc.leger.done{background:var(--leger);border:2px solid var(--leger);color:var(--on-accent)}
.wd .disc.lourd:not(.done){border-color:var(--lourd)}
.wd .disc.leger:not(.done){border-color:var(--leger)}
.wd.today span{color:var(--ink);font-weight:700}
.wd .disc.done{background:var(--ink);border:2px solid var(--ink);color:var(--bg)}
.week p{font-size:14px;color:var(--ink-2)}
.week p b{color:var(--ink)}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.legend i.lourd{background:var(--lourd)}
.legend i.leger{background:var(--leger)}

.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.pcard-h h3{font-size:20px;text-transform:uppercase}
.pcard .unit{font-size:12px;color:var(--ink-3)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.chart{position:relative;min-width:0}
.chart .ctitle{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;top:0;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;z-index:2}
.tip b{font-weight:700}
.insights{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.insights .k{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.insights .up{color:var(--ok)}
.insights .flat{color:var(--warn)}
.insights .down{color:var(--danger)}
.insights .conclu{color:var(--ink)}
.empty{font-size:13px;color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.empty-big{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.empty-big strong{font-family:var(--f-display);font-size:20px;color:var(--ink);text-transform:uppercase}

/* Historique */
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hrow-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.hrow-main .d{display:flex;align-items:center;gap:8px;font-weight:600}
.hrow-main .m{font-size:13px;color:var(--ink-3)}
.hrow-act{display:flex;gap:6px}
.hrow-act button{background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:600;color:var(--ink-2)}
.hrow-act button.confirm{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}

/* Sauvegarde */
.backup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink-2)}
.backup strong{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);text-transform:uppercase;margin-bottom:2px}
.backup-act{display:flex;gap:8px;flex-wrap:wrap}
.io-msg{font-size:13px;color:var(--ok)}
.io-msg.err{color:var(--danger)}

/* Programme */
.prog{display:flex;flex-direction:column;gap:22px}
.prog section{display:flex;flex-direction:column;gap:10px}
.prog h2{font-size:24px;text-transform:uppercase}
.prog h3{font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.prog p,.prog li{font-size:14px;color:var(--ink-2);max-width:65ch}
.prog p b,.prog li b{color:var(--ink)}
.prog ul,.prog ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.pbloc{display:flex;flex-direction:column;gap:8px}
.pbloc .how{font-size:13px;color:var(--ink-2)}

@media (max-width:420px){
  .brand span{display:none}
  .day h1{font-size:29px}
  .sets{grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr) 4.2rem}
  .t-time{font-size:30px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* Programme mis de côté */
.side-prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}
.side-prog strong{font-family:var(--f-display);font-size:20px;text-transform:uppercase;color:var(--ink)}
.side-prog .btn-ghost.confirm{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.reps-max{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink)}

/* Ouverte dans le navigateur */
.notice-browser{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink)}
.notice-browser strong{font-family:var(--f-display);font-size:19px;text-transform:uppercase;color:var(--warn)}

/* Fin de séance */
.finish-zone{display:flex;flex-direction:column;gap:8px}
.finish-note{font-size:13px;color:var(--ink-3);text-align:center}
.finish-note.err{color:var(--danger)}
.finish-card{background:var(--ok-soft);border:1px solid var(--ok);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink)}
.finish-card strong{font-family:var(--f-display);font-size:26px;text-transform:uppercase;color:var(--ok)}
.finish-card .btn-ghost{background:var(--surface)}
.next-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.next-card h2{font-size:24px;text-transform:uppercase;color:var(--ink)}
.fin-tag{color:var(--ok);font-weight:600}

/* Éditeur de programme */
.ed-head{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ed-title{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ed-title input,#pickSearch,.custom-form input[type="text"],.custom-form select{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);padding:0 12px;font-size:16px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink)}
.ed-sum{font-size:13px;color:var(--ink-2)}
.ed-blocs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ed-bloc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
.ed-bloc.dragging{z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.28);border-color:var(--ink-3)}
.ed-bloc-h{display:flex;align-items:center;gap:8px}
.ed-bloc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed-bloc-t strong{font-family:var(--f-display);font-size:20px;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.handle{flex:none;width:40px;height:52px;display:grid;place-items:center;border:0;border-radius:10px;background:var(--surface-2);color:var(--ink-3);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.handle svg{width:20px;height:20px}
.icon-btn{flex:none;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:18px;font-weight:700;color:var(--ink-2)}
.icon-btn:disabled{opacity:.3}
.icon-btn.del{color:var(--danger)}
.ed-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ed-row .lbl{min-width:62px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);overflow:hidden}
.stepper button{width:44px;height:40px;border:0;background:transparent;font-size:21px;font-weight:700;color:var(--ink)}
.stepper span{min-width:46px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px}
.seg2{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface)}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:0 14px;min-height:34px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg2 button.lourd[aria-pressed="true"]{background:var(--lourd);color:var(--on-accent)}
.seg2 button.leger[aria-pressed="true"]{background:var(--leger);color:var(--on-accent)}
.reps-in{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-3)}
.reps-in input{width:56px;height:40px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);text-align:center;font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--ink)}
.ed-item{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.ed-item-h{display:flex;align-items:center;gap:6px}
.ed-item-h .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;border:0;background:transparent;padding:4px 0;text-align:left}
.ed-item-h .nm span{font-size:15px;font-weight:700;color:var(--ink)}
.ed-item-h .nm small{font-size:12px;font-weight:600;color:var(--leger)}
.side-note{font-size:12px;color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:0 12px;min-height:36px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ed-actions{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.ed-actions .btn-ghost{width:100%;min-height:42px;border-radius:10px}
.move-row{display:flex;flex-direction:column;gap:6px}
.move-row .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.btn-add{width:100%;min-height:44px;padding:0 14px;border:1.5px dashed var(--line-2);border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:var(--ink-2)}
.btn-primary{width:100%;min-height:50px;padding:0 16px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.btn-danger{min-height:42px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:transparent;font-size:13px;font-weight:600;color:var(--danger)}
.btn-danger.confirm{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}
.vol-ok{color:var(--ok);font-weight:600}
.vol-low{color:var(--warn);font-weight:600}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
details.more summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details.more .rules{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.rules b{color:var(--ink)}
body.noscroll{overflow:hidden}
.sheet-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.sheet{width:min(680px,100%);max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet>*{flex-shrink:0}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet-h h2{font-size:24px;text-transform:uppercase}
.sheet .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-list button{display:flex;flex-direction:column;gap:2px;min-height:52px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.pick-list b{font-size:15px;color:var(--ink)}
.pick-list span{font-size:12px;color:var(--ink-3)}
.custom-form{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.custom-form strong{font-family:var(--f-display);font-size:20px;text-transform:uppercase}
.chk{display:flex;align-items:center;gap:8px;min-height:36px;font-size:14px;color:var(--ink-2)}
.chk input{width:20px;height:20px}
.date-in{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <div class="brand"><b>Repère</b><span>Musculation</span></div>
    <div class="status" id="status" data-s="loading" aria-live="polite"><i></i><span id="statusText">Chargement…</span></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-seance" aria-label="Séance du jour"></section>
  <section class="view" id="view-progres" aria-label="Progrès" hidden></section>
  <section class="view" id="view-historique" aria-label="Historique" hidden></section>
  <section class="view" id="view-programme" aria-label="Programme" hidden></section>
</main>

<div class="timer" id="timer" hidden role="timer">
  <div class="t-row">

      <button type="button" data-act="t-minus" id="tMinus">−15 s</button>
      <button type="button" data-act="t-plus" id="tPlus">+15 s</button>
      <button type="button" data-act="t-stop" id="tStop">Arrêter</button>
    </div>
  </div>
  <div class="t-bar"><i id="tBar"></i></div>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<nav class="tabs" aria-label="Navigation">
  <div class="tabs-in">
    <button type="button" data-tab="seance" id="tab-seance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2M19 12h2M6 8v8M18 8v8M9 6v12M15 6v12M9 12h6"/></svg>Séance</button>
    <button type="button" data-tab="progres" id="tab-progres">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M5 15l4-4 3 3 7-7"/><path d="M15 7h4v4"/></svg>Progrès</button>
    <button type="button" data-tab="historique" id="tab-historique">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Historique</button>
    <button type="button" data-tab="programme" id="tab-programme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15H6V5a1 1 0 0 1 1-1z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Programme</button>
  </div>
</nav>

<script>
(function(){
"use strict";

/* ===================== Bibliothèque d'exercices ===================== */
const MUSCLES = ["Quadriceps","Fessiers","Ischios","Pecs","Dos","Épaules","Biceps","Triceps","Mollets","Abdos"];
const LIB = {};
function L(id, name, m, o){ LIB[id] = Object.assign({id, name, m, unit:"kg", inc:2.5, cue:""}, o || {}); }
// Jambes
L("presse","Presse pieds bas",{Quadriceps:1},{inc:5, cue:"Pieds bas sur le plateau, talons collés. Descends au moins à 90° de genou, bas du dos collé au dossier."});
L("pressehaut","Presse pieds hauts écartés",{Fessiers:.5,Quadriceps:.5},{inc:5, cue:"Pieds hauts et écartés, pointes un peu vers l'extérieur, genoux dans l'axe des pieds."});
L("presseincl","Presse inclinée",{Quadriceps:1},{inc:5, cue:"Dos bien calé, descends profond sans décoller le bas du dos."});
L("presseunil","Presse inclinée unilatérale (fessiers)",{Fessiers:.5,Quadriceps:.5},{inc:5, side:"jambe", cue:"Une jambe, pied haut sur le plateau. Descends profond en gardant le bassin collé au dossier."});
L("sissy","Sissy squat / pendulum",{Quadriceps:1},{zero:true, cue:"Genoux vers l'avant, buste droit, descends lentement. Mets 0 au poids du corps."});
L("hipthrust","Hip thrust",{Fessiers:1},{inc:5, cue:"Haut du dos sur le banc, menton rentré. Pause 1 s en haut en serrant les fessiers."});
L("kickback","Kickback poulie",{Fessiers:1},{side:"jambe", cue:"Poulie en bas, sangle à la cheville. Jambe vers l'arrière sans cambrer le bas du dos."});
L("legcurl","Leg curl assis",{Ischios:1},{side:"jambe", cue:"Chaise face à la poulie montée, sangle à la cheville. Penche le buste en avant, redescends en 2–3 s."});
L("nordic","Nordic curl",{Ischios:1},{zero:true, cue:"Genoux calés, descends le plus lentement possible, hanches tendues. Jamais à l'échec."});
L("rdlpoulie","Soulevé de terre roumain à la poulie",{Ischios:1},{s:{Fessiers:1}, cue:"Hanches vers l'arrière, dos plat, genoux légèrement fléchis. Remonte en serrant les fessiers."});
L("jefferson","Jefferson curl",{Ischios:1},{inc:2, cue:"Charge légère. Enroule le dos vertèbre par vertèbre, puis remonte lentement."});
L("mollets","Mollets sur une marche",{Mollets:1},{side:"jambe", unit:"kg en plus", zero:true, cue:"Une jambe à la fois. Talon bien bas avec une pause de 1–2 s, puis monte au maximum."});
// Pecs
L("dips","Dips lestés",{Pecs:1},{s:{Triceps:1,"Épaules":1}, unit:"kg de lest", zero:true, cue:"Descends tant que tes épaules restent confortables. Mets 0 si tu les fais sans lest."});
L("devpoulie","Développé à la poulie",{Pecs:1},{s:{Triceps:1,"Épaules":1}, cue:"Poulies à hauteur de poitrine, un pied devant l'autre. Pousse vers l'avant en rapprochant les mains."});
L("developpe","Développé haltères",{Pecs:1},{s:{Triceps:1,"Épaules":1}, inc:2, cue:"Omoplates serrées sur le banc, descends les haltères au niveau de la poitrine."});
L("pompes","Pompes",{Pecs:1},{s:{Triceps:1,"Épaules":1}, zero:true, cue:"Corps gainé, poitrine jusqu'au sol. Mets 0 au poids du corps."});
L("demipompes","Demi-pompes",{Pecs:1},{s:{Triceps:1,"Épaules":1}, zero:true, cue:"Amplitude basse uniquement, sans remonter complètement."});
// Épaules
L("militaire","Développé militaire à la barre",{"Épaules":1},{s:{Triceps:1}, cue:"Fessiers et abdos serrés, la barre passe près du visage puis finit au-dessus de la tête."});
L("militaireh","Développé militaire haltères",{"Épaules":1},{s:{Triceps:1}, inc:2, cue:"Assis ou debout, pousse les haltères au-dessus de la tête sans cambrer."});
L("zpress","Z press haltères",{"Épaules":1},{s:{Triceps:1}, inc:2, cue:"Assis au sol jambes tendues, dos droit sans appui."});
L("pike","Pike push-ups",{"Épaules":1},{s:{Triceps:1}, zero:true, cue:"Hanches hautes, la tête descend entre les mains."});
L("laterales","Élévations latérales poulie",{"Épaules":1},{cue:"Bras presque tendu, monte jusqu'à l'horizontale, redescends lentement."});
L("lateralesh","Élévations latérales haltères",{"Épaules":1},{inc:1, cue:"Monte jusqu'à l'horizontale, coudes légèrement fléchis."});
L("oiseaupoulie","Oiseau poulie",{"Épaules":1},{cue:"Buste penché, écarte les bras vers l'arrière en serrant les omoplates."});
L("oiseauh","Oiseau haltères",{"Épaules":1},{inc:1, cue:"Buste penché, écarte les bras vers l'arrière en serrant les omoplates."});
L("facepull","Face pull",{"Épaules":1},{cue:"Corde à hauteur des yeux, tire vers le visage en écartant les mains."});
// Dos
L("rowing","Rowing haltère",{Dos:1},{s:{Biceps:1}, inc:2, side:"bras", cue:"Un genou et une main sur le banc, dos plat. Tire l'haltère vers la hanche, sans élan."});
L("rowingpoulie","Rowing poulie unilatéral",{Dos:1},{s:{Biceps:1}, side:"bras", cue:"Tire la poignée vers la hanche, coude près du corps, épaule basse."});
L("rowingbuch","Rowing bûcheron",{Dos:1},{s:{Biceps:1}, inc:2, side:"bras", cue:"Buste penché, tire l'haltère vers la hanche en arc de cercle."});
L("tractionspro","Tractions pronation",{Dos:1},{s:{Biceps:1}, unit:"kg de lest", zero:true, cue:"Mains en pronation, monte la poitrine vers la barre. Mets 0 au poids du corps."});
L("tractionssupi","Tractions supination",{Dos:1},{s:{Biceps:1}, unit:"kg de lest", zero:true, cue:"Mains en supination, monte le menton au-dessus de la barre."});
L("shrugs","Shrugs poulie",{Dos:1},{cue:"Monte les épaules vers les oreilles, pause 1 s en haut."});
L("tirage","Tirage à la corde",{Dos:1},{hidden:true});
// Bras
L("curl","Curl haltères alterné",{Biceps:1},{inc:2, cue:"Coudes collés au corps, monte sans balancer le buste."});
L("curlmarteaup","Curl marteau poulie",{Biceps:1},{cue:"Corde ou poignée, prise neutre, coudes fixes."});
L("curlmarteauh","Curl marteau haltères",{Biceps:1},{inc:2, cue:"Prise neutre, coudes fixes, redescends en contrôlant."});
L("bayesian","Bayesian curl",{Biceps:1},{side:"bras", cue:"Dos à la poulie, bras tiré vers l'arrière, curl sans avancer le coude."});
L("triceps","Triceps corde au-dessus de la tête",{Triceps:1},{cue:"Dos à la poulie haute, coudes fixes pointés vers l'avant, tends complètement les bras."});
L("tricepsunil","Extension triceps corde unilatérale",{Triceps:1},{side:"bras", cue:"Coude fixe contre le corps, tends complètement le bras."});
L("katana","Katana triceps",{Triceps:1},{side:"bras", cue:"Poulie basse, coude pointé vers le haut derrière la tête, tends le bras en diagonale."});
// Abdos
L("releves","Relevés de jambes",{Abdos:1},{zero:true, cue:"En appui sur la barre à dips. Monte les genoux vers la poitrine en enroulant le bassin, sans balancer."});

/* ===================== Programme par défaut ===================== */
const DAY_KEYS = ["lun","mar","mer","jeu","ven","we"];
const CORE_KEYS = ["lun","mar","mer","jeu","ven"];
const DAY_META = {lun:{label:"Lundi",short:"Lun",letter:"L"}, mar:{label:"Mardi",short:"Mar",letter:"M"}, mer:{label:"Mercredi",short:"Mer",letter:"M"}, jeu:{label:"Jeudi",short:"Jeu",letter:"J"}, ven:{label:"Vendredi",short:"Ven",letter:"V"}, we:{label:"Week-end",short:"W-E",letter:"W"}};
const SEP = "__";
const baseId = id => String(id).split(SEP)[0];
const phaseNo = id => { const p = String(id).split(SEP)[1]; return p ? +p : 1; };
const PI = (id, sets, lo, hi, mode, x) => Object.assign({id, sets, reps:[lo,hi], mode}, x || {});
const P1 = (id, lo, hi) => PI(id, 1, lo, hi, "lourd");
const P2 = (id, lo, hi) => PI(id + SEP + "2", 1, lo, hi, "leger");
const PMAX = (id, mode) => PI(id, 5, 1, 30, mode || "leger", {emom:5, max:true, effort:"Le maximum de reps à chaque minute"});
const DEFAULT_PROGRAM = {v:2, custom:{}, days:{
  lun:{title:"Upper 1 · haut du corps", warm:"1 série légère de tractions et de dips, 1 série légère de développé.",
    hint:"Chaque exercice se fait en 2 séries : la 1re lourde, la 2e légère. Dans un module, enchaîne les exercices dans l'ordre affiché.",
    blocs:[
      {title:"Tractions ↔ Dips", rest:[120], restTxt:"1 min 30 à 2 min entre chaque exercice", how:"Tractions lourdes (4–6), repos, dips lourds (4–6), repos. Puis tractions légères (8–10), repos, dips légers (8–10).",
        items:[P1("tractionspro",4,6), P1("dips",4,6), P2("tractionspro",8,10), P2("dips",8,10)]},
      {title:"Développé haltères ↔ Oiseau poulie", rest:[90], how:"Développé lourd (6–8), oiseau à 8 reps, puis développé léger (10–12), oiseau à 12 reps. Repos entre chaque exercice.",
        items:[P1("developpe",6,8), P1("oiseaupoulie",8,8), P2("developpe",10,12), P2("oiseaupoulie",12,12)]},
      {title:"Développé militaire ↔ Curl marteau poulie", rest:[90], how:"Militaire lourd (6–8), curl marteau à 8 reps, puis militaire léger (10–12), curl marteau à 12 reps.",
        items:[P1("militaire",6,8), P1("curlmarteaup",8,8), P2("militaire",10,12), P2("curlmarteaup",12,12)]},
      {title:"Élévations latérales ↔ Curl ↔ Triceps", rest:[60], how:"Les trois exercices à la suite à 8 reps, repos, puis les trois à la suite à 12 reps.",
        items:[P1("laterales",8,8), P1("curl",8,8), P1("tricepsunil",8,8), P2("laterales",12,12), P2("curl",12,12), P2("tricepsunil",12,12)]}]},
  mar:{title:"Lower 1 · bas du corps", warm:"2 séries légères de presse, 1 série de Nordic facile.",

/* ===================== Programme (modifiable) ===================== */
let program = null;

function prepProgram(p){
  p.custom = p.custom || {};

  DAY_KEYS.forEach(k => { p.days[k].blocs.forEach(b => { if(!b.id) b.id = uid(); b.items = (b.items || []).filter(it => it && it.id); }); });

}
const LS_OLD = "repere-musculation-programme-de-cote";

      // Une seule fois : l'ancien programme est mis de côté, le programme Upper / Lower le remplace
      if(validProgram(p)) localStorage.setItem(LS_OLD, JSON.stringify(p));
      const np = clone(DEFAULT_PROGRAM); if(p && p.custom) np.custom = p.custom;
      p = np; localStorage.setItem(LS_PROG, JSON.stringify(p)); localStorage.setItem(LS_UL, "1");

}

}
function exo(id){ const b = baseId(id); return LIB[b] || (program && program.custom[b]) || {id:b, name:b, m:{}, unit:"kg", inc:2.5, cue:""}; }
const rngTxt = it => it.max ? "max" : (it.reps[0] === it.reps[1] ? String(it.reps[0]) : it.reps[0] + "–" + it.reps[1]);
function itemTitle(it, b){

}
function itemOfAny(id){ for(const k of DAY_KEYS){ for(const b of day(k).blocs){ const it = b.items.find(x => x.id === id); if(it) return {it, b}; } } return null; }
function exoName(id){ return exo(id).name; }
function sideTxt(id){ return exo(id).side ? " par " + exo(id).side : ""; }
const day = k => program.days[k];
const planItems = k => day(k).blocs.flatMap(b => b.items);
const planTotal = k => planItems(k).reduce((s,it) => s + it.sets, 0);
const activeIds = () => { const out = []; DAY_KEYS.forEach(k => planItems(k).forEach(it => { const b = baseId(it.id); if(out.indexOf(b) < 0) out.push(b); })); return out; };
function blockSec(b){
  if(b.emom) return b.emom * 60 + 60;
  const r = blockRest(b), rest = r.reduce((s,x) => s + x, 0) / r.length;
  return b.items.reduce((s,it) => s + (it.emom ? it.emom * 60 + 30 : it.sets * ((exo(it.id).side ? 90 : 45) + rest)), 0) + 60;
}
function estMin(k){
  const bl = day(k).blocs; if(!bl.length) return 0;
  const sec = 5*60 + bl.reduce((s,b) => s + blockSec(b), 0) + (bl.length - 1) * 120;
  return Math.max(5, Math.round(sec / 60));
}
function blockTitle(b){

  const names = []; b.items.forEach(it => { const n = (it.emom && !b.emom ? "EMOM " : "") + exoName(it.id); if(names.indexOf(n) < 0 && names.indexOf(exoName(it.id)) < 0) names.push(n); });
  return (b.emom ? "EMOM " : "") + (names.length ? names.join(" ↔ ") : "Module vide");

  const phased = b.items.some(it => it.emom || phaseNo(it.id) > 1 || it.max);
  if(b.items.length > 1 && phased) return "Dans l'ordre : " + b.items.map(it => itemTitle(it, b).toLowerCase() + (it.emom ? " (EMOM " + it.emom + " min" + (it.max ? ", max de reps" : "") + ")" : " (" + rngTxt(it) + " reps)")).join(", puis ") + ". Repos entre chaque exercice.";

function effortOf(it){ return it.effort || (it.mode === "lourd" ? "RIR 1–2" : "RIR 1–2, dernière série à l'échec possible"); }

/* ===================== État des séances ===================== */
let sessions = new Map();
let loaded = false;
let store = {mode:"local"};
let current = null;
let dirty = false, saving = false, again = false, saveTimer = null, readonly = false;
let activeTab = "seance";

function cleanSets(arr){ return (Array.isArray(arr) ? arr : []).map(v => ({kg:(v && typeof v.kg === "number") ? v.kg : null, reps:(v && typeof v.reps === "number") ? v.reps : null})); }
function applyPlan(s){
  planItems(s.day).forEach(it => {
    let arr = s.exos[it.id] || (s.exos[it.id] = []);
    if(!arr.some(isDone) && arr.length > it.sets){ arr = s.exos[it.id] = arr.slice(0, it.sets); }
    while(arr.length < it.sets) arr.push({kg:null, reps:null});
    if(!arr.some(isDone) || !s.modes[it.id]) s.modes[it.id] = it.mode;
  });
  return s;
}
function emptySession(date, d){ return applyPlan({date, day:d, v:2, exos:{}, modes:{}}); }
function normalize(doc){
  const d = (doc.day && DAY_KEYS.indexOf(doc.day) >= 0) ? doc.day : (plannedDay(doc.date) || "lun");
  const s = {date: doc.date, day: d, v:2, exos:{}, modes:{}};
  if(doc.updatedAt) s.updatedAt = doc.updatedAt;
  if(doc.finishedAt) s.finishedAt = doc.finishedAt;
  if(doc.type && !doc.day) s.legacy = true;
  const src = (doc.exos && typeof doc.exos === "object") ? doc.exos : {};
  Object.keys(src).forEach(id => { s.exos[id] = cleanSets(src[id]); });
  const modes = (doc.modes && typeof doc.modes === "object") ? doc.modes : {};
  Object.keys(s.exos).forEach(id => {
    if(modes[id] === "lourd" || modes[id] === "leger") s.modes[id] = modes[id];
    else if(doc.type === "lourd" || doc.type === "leger") s.modes[id] = doc.type;
  });
  return applyPlan(s);
}
function serialize(s){ const o = {date:s.date, day:s.day, v:2, exos:clone(s.exos), modes:clone(s.modes)}; if(s.finishedAt) o.finishedAt = s.finishedAt; return o; }
function doneIn(s, id){ return (s.exos[id] || []).filter(isDone); }
function donePlan(s){ return planItems(s.day).reduce((n,it) => n + Math.min(it.sets, doneIn(s, it.id).length), 0); }
function doneAll(s){ return Object.keys(s.exos).reduce((n,id) => n + doneIn(s,id).length, 0); }
function tonnage(s){ let t = 0; Object.keys(s.exos).forEach(id => doneIn(s,id).forEach(x => { if(x.kg) t += x.kg * x.reps * (exo(id).side ? 2 : 1); })); return t; }
function sortedSessions(dir){ const arr = [...sessions.values()].map(normalize); arr.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); return dir === "desc" ? arr.reverse() : arr; }
function setsOfBase(s, base, mode){ const out = []; Object.keys(s.exos).forEach(k => { if(baseId(k) === base && s.modes[k] === mode) doneIn(s, k).forEach(x => out.push(x)); }); return out; }
function lastFor(id, date, mode, maxOnly){
  const base = baseId(id);
  for(const s of sortedSessions("desc")){
    if(s.date >= date) continue;
    // Pour un EMOM « max de reps », on compare au même EMOM ; sinon on prend toutes les séries de l'exercice dans ce mode
    const sets = maxOnly ? (s.modes[id] === mode ? doneIn(s, id) : []) : setsOfBase(s, base, mode);
    if(sets.length) return {date:s.date, sets};
  }
  return null;
}
function suggestion(it, last){
  const e = exo(it.id), lo = it.reps[0], hi = it.reps[1], u = e.unit, rt = rngTxt(it);
  if(it.max){
    if(!last) return {kind:"new", kg:null, text:"Première fois : fais le maximum de reps à chaque minute et note-les. La prochaine fois, l'objectif sera de battre ce total."};
    const tot = last.sets.reduce((s,x) => s + x.reps, 0), kgm = Math.max(...last.sets.map(s => s.kg || 0));
    return {kind:"same", kg: kgm, text:"La dernière fois : " + tot + " reps au total. Essaie de faire au moins " + (tot + 1) + "."};
  }
  if(!last) return {kind:"new", kg:null, text:"Première fois en " + MODE_LABEL[it.mode].toLowerCase() + " : choisis une charge qui te donne " + rt + " reps, en finissant à 1–2 reps de l'échec."};
  const sets = last.sets.slice(-Math.max(it.sets, 1));
  const topKg = Math.max(...sets.map(s => s.kg || 0));
  const full = sets.length >= it.sets && sets.every(s => s.reps >= hi);
  if(full){
    const next = round1(roundStep(topKg + e.inc, e.inc >= 2.5 ? 2.5 : 1));
    return {kind:"up", kg: next, text:(sets.length > 1 ? "Toutes tes séries ont atteint " : "Tu as atteint ") + hi + " reps. Monte à " + fmt(next) + " " + u + (lo < hi ? " et repars du bas de la fourchette." : ".")};
  }
  const keep = topKg > 0 ? "Garde " + fmt(topKg) + " " + u : (e.zero ? "Garde le poids du corps" : "Garde la même charge");
  if(sets[0].reps < lo) return {kind:"warn", kg: topKg, text: keep + " et vise " + (lo < hi ? "au moins " + lo : lo) + " reps avant de monter."};
  return {kind:"same", kg: topKg, text: keep + " et ajoute 1 rep quelque part par rapport à la dernière fois."};
}

/* ===================== Stockage ===================== */
const STATUS_TXT = {loading:"Chargement…", local:"Enregistré", pending:"Modification…", saving:"Enregistrement…", error:"Non enregistré"};
function setStatus(s, txt){ const el = $("#status"); el.dataset.s = s; $("#statusText").textContent = txt || STATUS_TXT[s] || ""; }
function persistLocal(){ try{ const o = {}; sessions.forEach((v,k) => { o[k] = v; }); localStorage.setItem(LS_KEY, JSON.stringify(o)); return true; }catch(e){ return false; } }
function initStore(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const o = JSON.parse(raw); sessions = new Map(Object.entries(o)); } }catch(e){}
  loaded = true; setStatus("local"); onData();
}
function scheduleSave(){ dirty = true; setStatus("pending"); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600); }
async function flush(){
  clearTimeout(saveTimer); saveTimer = null;
  if(!dirty || !current) return;
  dirty = false;
  const doc = serialize(current); doc.updatedAt = new Date().toISOString();
  sessions.set(doc.date, doc);
  if(!persistLocal()){ dirty = true; setStatus("error", "Non enregistré : stockage indisponible"); return; }
  setStatus("local");

}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flush(); else checkDayChange(); });
let lastToday = todayIso();
function checkDayChange(){
  const t = todayIso(); if(t === lastToday) return;
  const prev = lastToday; lastToday = t;
  if(current && current.date === prev) openDate(t);
}
window.addEventListener("focus", checkDayChange);
window.addEventListener("pageshow", checkDayChange);
setInterval(checkDayChange, 30000);
function onData(){
  stale.progres = stale.historique = true;
  if(current && !dirty){ const saved = sessions.get(current.date); if(saved) current = normalize(clone(saved)); }
  if(!current) openDate(todayIso(), true);
  else renderSeance();
  if(activeTab === "progres") renderProgres();
  if(activeTab === "historique") renderHistorique();
}

let reviewFinished = false;
async function openDate(iso, silent){

  renderSeance();
}
const CLOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 3h6"/></svg>';

function emomBtn(min){ return '<button type="button" class="chip-btn emom-btn" data-act="emom" data-min="'+min+'">'+CLOCK_SVG+'Lancer l\'EMOM '+min+' min</button>'; }
function itemOf(id){ return planItems(current.day).find(it => it.id === id); }
function stateOf(id, i){
  const s = current.exos[id][i]; const it = itemOf(id); const r = it ? it.reps : [0,0];
  if(it && it.max) return isDone(s) ? {cls:"in", txt:"✓ "+s.reps} : {cls:"", txt:"max"};

}
function exoHTML(it, b){
  const id = it.id, e = exo(id), r = it.reps, mode = it.mode, em = (b && b.emom) || it.emom, rt = rngTxt(it);
  const last = lastFor(id, current.date, mode, !!it.max);
  const sg = suggestion(it, last);
  const arr = current.exos[id];
  const doneN = Math.min(it.sets, arr.filter(isDone).length);
  const lastTxt = last
    ? 'Dernière fois en ' + MODE_LABEL[mode].toLowerCase() + ' (' + fShort.format(dateOf(last.date)) + ') : <b class="num">' + last.sets.map(s => (s.kg ? fmt(s.kg)+"×" : "") + s.reps).join(" · ") + '</b>' + sideTxt(id)
    : "Pas encore de série " + (mode === "lourd" ? "lourde" : "légère") + " enregistrée pour cet exercice.";
  const tag = sg.kind === "up" ? "Monte" : sg.kind === "warn" ? "Garde" : sg.kind === "same" ? "Objectif" : "Départ";
  const fillBtn = (sg.kg != null && sg.kg > 0) ? '<button type="button" data-act="fill" data-exo="'+id+'">Mettre '+fmt(sg.kg)+' kg</button>' : "";

let tEnd = 0, tDur = 0, tInt = null, tHide = null, audio = null, wake = null, emom = null;
function fmtClock(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60)+":"+pad(s%60); }
function beep(times){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .28, .56].slice(0, times || 3).forEach(off => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = 880; o.connect(g); g.connect(audio.destination);

    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}

function tick(){

    const minute = Math.floor(el/60) + 1;

    if(minute !== emom.cur){ emom.cur = minute; beep(1); }
    const left = 60 - (el % 60);
    $("#tTime").textContent = fmtClock(left);
    $("#tLabel").textContent = "EMOM · minute " + minute + " / " + emom.mins;
    $("#tBar").style.width = Math.max(0, Math.min(100, left/60*100)) + "%";

  }
  const left = (tEnd - Date.now())/1000;
  $("#tTime").textContent = fmtClock(left);

function wakeAudio(){ try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if(audio.state === "suspended") audio.resume(); }catch(e){} }

/* ===================== Progrès ===================== */
function seriesFor(id, mode){

  const arr = sortedSessions("asc").filter(s => setsOfBase(s, base, mode).length);
  const all = []; arr.forEach(s => setsOfBase(s, base, mode).forEach(x => all.push(x)));
  const kgMode = all.some(x => x.kg > 0) ? "kg" : "reps";
  const pts = [];

    let best = null, bv = -1;
    setsOfBase(s, base, mode).forEach(x => { const val = kgMode === "kg" ? (x.kg > 0 ? x.kg*(1 + x.reps/30) : -1) : x.reps; if(val > bv){ bv = val; best = x; } });

  });

const CHARTS = {}; let chartSeq = 0;
function chartSVG(seriesList, mode){

  }

  const reg = [], ends = [];

    if(!s.pts.length) return;

function insightFor(s){
  const p = s.pts; if(p.length < 2) return null;
  const first = p[0], last = p[p.length-1], u = s.mode === "kg" ? " kg" : " reps";
  const l3 = p.slice(-3);
  const spread = Math.max(...l3.map(x => x.v)) - Math.min(...l3.map(x => x.v));
  if(p.length >= 3 && spread <= Math.max(0.5, last.v*0.01)) return {cls:"flat", txt:"stable sur les 3 dernières séances"};
  const d = round1(last.v - first.v); const pct = first.v ? Math.round(d/first.v*100) : 0;
  if(d > 0) return {cls:"up", txt:"+"+fmt(d)+u+" depuis le "+fDM.format(dateOf(first.date))+" (+"+pct+" %)"};
  if(d < 0) return {cls:"down", txt:fmt(d)+u+" depuis le "+fDM.format(dateOf(first.date))};
  return {cls:"flat", txt:"au même niveau qu'au départ"};
}

    const src = (o && o.seances && typeof o.seances === "object") ? o.seances : null;

    + '<details class="more"><summary>Les règles du programme</summary><ul class="rules">'
    + '<li><b>Série dure :</b> finie à 1–2 reps de l\'échec. L\'échauffement ne compte pas.</li>'
    + '<li><b>Module :</b> 1 à 3 exercices enchaînés. Associe des muscles différents : le léger se fait pendant le repos du lourd.</li>'
    + '<li><b>Lourd / léger :</b> en lourd, peu de reps et charge haute ; en léger, plus de reps. Près de l\'échec, les deux font grossir autant. L\'app suit les deux séparément.</li>'
    + '<li><b>Deux séries par exercice :</b> la 1re lourde, la 2e légère. « + Autre série » en ajoute une avec sa propre fourchette.</li>'
    + '<li><b>Double progression :</b> ajoute des reps jusqu\'au haut de la fourchette, puis de la charge. L\'app te le propose à chaque exercice.</li>'
    + '<li><b>Protéines :</b> environ 1,6 g par kg de poids de corps et par jour.</li></ul></details>'
    + '<details class="more"><summary>Sources</summary><ul class="rules">'
    + '<li><a href="https://train.fitness/personal-trainer-blogs/not-all-sets-are-created-equal" target="_blank" rel="noopener">Pelland et al., volume et fréquence</a></li>'
    + '<li><a href="https://pubmed.ncbi.nlm.nih.gov/28834797/" target="_blank" rel="noopener">Schoenfeld et al. 2017, charges légères vs lourdes</a></li>'
    + '<li><a href="https://pubmed.ncbi.nlm.nih.gov/36199287/" target="_blank" rel="noopener">Plotkin et al. 2022, progression en charge vs en reps</a></li>'
    + '<li><a href="https://eprints.leedsbeckett.ac.uk/id/eprint/11908" target="_blank" rel="noopener">Zhang et al. 2025, supersets</a></li>'
    + '<li><a href="https://www.strongerbyscience.com/?p=62454" target="_blank" rel="noopener">Leg curl assis vs Nordic curl</a></li>'
    + '<li><a href="https://bjsm.bmj.com/content/52/6/376" target="_blank" rel="noopener">Morton et al. 2018, protéines</a></li></ul></details>'
    + (sideProgram() ? '<div class="side-prog"><strong>Programme mis de côté</strong><span>Ton programme précédent est gardé sur ce téléphone, avec toutes tes modifications. Tu peux échanger les deux à tout moment.</span><button type="button" class="btn-ghost'+(edConfirm==="side"?" confirm":"")+'" data-act="prog-side">'+(edConfirm==="side"?"Confirmer l\'échange":"Reprendre le programme mis de côté")+'</button></div>' : '')
    + '<button type="button" class="btn-danger'+(edConfirm===resetKey?" confirm":"")+'" data-act="prog-reset">'+(edConfirm===resetKey?"Confirmer : revenir au programme Upper / Lower de départ":"Revenir au programme Upper / Lower de départ")+'</button>';
}
function progChanged(b){
  markEdited(edDay, b); saveProgram();
  if(current && current.day === edDay){ applyPlan(current); }
  renderProgramme();
}
function onEditorInput(el){
  const f = el.dataset.ed, D = day(edDay);
  if(f === "title"){ const t = el.value.trim(); if(t){ D.title = t; saveProgram(); } return; }
  if(f === "warm"){ D.warm = el.value.trim(); saveProgram(); return; }
  const b = D.blocs[+el.dataset.bi]; if(!b) return; const it = b.items[+el.dataset.ii]; if(!it) return;
  const n = parseNum(el.value, true); if(n == null || n < 1 || n > 50) return;
  if(f === "lo") it.reps[0] = n;
  if(f === "hi") it.reps[1] = n;
  markEdited(edDay, b); saveProgram();
  if(current && current.day === edDay) applyPlan(current);
}
function onEditorChange(el){
  const f = el.dataset.ed, D = day(edDay);
  if(f === "title"){ D.title = el.value.trim() || DAY_META[edDay].label; el.value = D.title; saveProgram(); return; }
  if(f === "warm"){ D.warm = el.value.trim(); saveProgram(); return; }
  const b = D.blocs[+el.dataset.bi]; if(!b) return; const it = b.items[+el.dataset.ii]; if(!it) return;
  let n = parseNum(el.value, true); if(n == null || n < 1) n = 1; n = Math.min(n, 50);
  if(f === "lo"){ it.reps[0] = n; if(it.reps[1] < n) it.reps[1] = n; }
  if(f === "hi"){ it.reps[1] = n; if(it.reps[0] > n) it.reps[0] = n; }
  markEdited(edDay, b); saveProgram();
  if(current && current.day === edDay) applyPlan(current);
  // On met à jour les deux champs sans redessiner la page, pour garder le clavier ouvert sur le champ suivant
  const row = el.closest(".reps-in");
  if(row){ row.querySelector("[data-ed='lo']").value = it.reps[0]; row.querySelector("[data-ed='hi']").value = it.reps[1]; }
}
function onEditorClick(a){
  const act = a.dataset.act, D = day(edDay);
  const bi = a.dataset.bi != null ? +a.dataset.bi : -1, ii = a.dataset.ii != null ? +a.dataset.ii : -1;
  const b = bi >= 0 ? D.blocs[bi] : null;
  if(act !== "b-moveto") edNotice = null;
  if(act === "ed-day"){ edDay = a.dataset.day; edConfirm = null; edMove = null; renderProgramme(); window.scrollTo(0,0); return true; }
  if(act === "b-up" && b && bi > 0){ D.blocs.splice(bi-1, 0, D.blocs.splice(bi, 1)[0]); progChanged(null); return true; }
  if(act === "b-down" && b && bi < D.blocs.length-1){ D.blocs.splice(bi+1, 0, D.blocs.splice(bi, 1)[0]); progChanged(null); return true; }
  if(act === "b-move" && b){ edMove = edMove === b.id ? null : b.id; renderProgramme(); return true; }
  if(act === "b-moveto" && b){
    const to = a.dataset.day; if(DAY_KEYS.indexOf(to) < 0 || to === edDay) return true;
    D.blocs.splice(bi, 1); day(to).blocs.push(b); markEdited(to, null); edMove = null;
    edNotice = "Module « " + blockTitle(b) + " » déplacé vers " + (to === "we" ? "le week-end" : "le " + DAY_META[to].label.toLowerCase()) + ".";
    if(current && current.day === to) applyPlan(current);
    progChanged(null); return true;
  }
  if(act === "b-del" && b){ const key = "b:" + b.id; if(edConfirm === key){ edConfirm = null; D.blocs.splice(bi, 1); progChanged(null); } else { askConfirm(key); renderProgramme(); } return true; }
  if(act === "b-emom" && b){ const on = a.dataset.on === "1"; if(on && !b.emom){ b.emom = 5; b.items.forEach(it => { it.sets = b.items.length === 1 ? 5 : Math.ceil(5 / b.items.length); }); } else if(!on && b.emom){ delete b.emom; b.items.forEach(it => { it.sets = Math.min(it.sets, 4); }); } progChanged(b); return true; }
  if(act === "b-emin" && b && b.emom){ b.emom = Math.max(1, Math.min(30, b.emom + (+a.dataset.d))); if(b.items.length === 1) b.items[0].sets = b.emom; progChanged(b); return true; }
  if(act === "b-rest" && b){ b.rest = [+a.dataset.sec]; progChanged(b); return true; }
  if(act === "i-sets" && b && b.items[ii]){ const it = b.items[ii]; it.sets = Math.max(1, Math.min(b.emom || it.emom ? 30 : 10, it.sets + (+a.dataset.d))); if(it.emom) it.emom = it.sets; if(b.emom && b.items.length === 1) b.emom = it.sets; progChanged(b); return true; }
  if(act === "i-emom" && b && b.items[ii]){ const it = b.items[ii]; if(it.emom){ delete it.emom; it.sets = Math.min(it.sets, 4); } else { it.emom = 5; it.sets = 5; } progChanged(b); return true; }
  if(act === "i-max" && b && b.items[ii]){ const it = b.items[ii]; if(it.max){ delete it.max; if(it.reps[1] > 20) it.reps = [8,12]; } else it.max = true; delete it.effort; progChanged(b); return true; }
  if(act === "i-phase" && b && b.items[ii]){ const it = b.items[ii]; const base = baseId(it.id), nid = freeId(base); let pos = ii; b.items.forEach((x, k) => { if(baseId(x.id) === base) pos = k; }); b.items.splice(pos+1, 0, {id:nid, sets:1, reps:it.reps.slice(), mode:"leger"}); progChanged(b); return true; }
  if(act === "i-mode" && b && b.items[ii]){ b.items[ii].mode = a.dataset.mode; delete b.items[ii].effort; progChanged(b); return true; }
  if(act === "i-up" && b && ii > 0){ b.items.splice(ii-1, 0, b.items.splice(ii, 1)[0]); progChanged(b); return true; }
  if(act === "i-down" && b && ii < b.items.length-1){ b.items.splice(ii+1, 0, b.items.splice(ii, 1)[0]); progChanged(b); return true; }
  if(act === "i-del" && b && b.items[ii]){ b.items.splice(ii, 1); if(!b.items.length) D.blocs.splice(bi, 1); progChanged(b.items.length ? b : null); return true; }
  if(act === "i-add" && b){ openPicker({mode:"add", bi}); return true; }
  if(act === "i-swap" && b){ openPicker({mode:"swap", bi, ii}); return true; }
  if(act === "b-new"){ openPicker({mode:"new"}); return true; }
  if(act === "prog-side"){
    if(edConfirm === "side"){
      edConfirm = null; const other = sideProgram(); if(!other) return true;
      try{ localStorage.setItem(LS_OLD, JSON.stringify(program)); }catch(e){}
      program = prepProgram(other); saveProgram(); if(current) applyPlan(current);
      edNotice = "Programme échangé. L'autre est mis de côté : tu peux revenir dessus avec le même bouton.";
      renderProgramme();
    } else { askConfirm("side"); renderProgramme(); }
    return true;
  }
  if(act === "prog-reset"){ if(edConfirm === "reset"){ edConfirm = null; const custom = program.custom; program = prepProgram(clone(DEFAULT_PROGRAM)); program.custom = custom; saveProgram(); if(current) applyPlan(current); renderProgramme(); } else { askConfirm("reset"); renderProgramme(); } return true; }
  return false;
}
/* Glisser-déposer des modules */
let drag = null;
document.addEventListener("pointerdown", ev => {
  const svg = ev.target.closest && ev.target.closest("svg[data-chart]");
  document.querySelectorAll("svg[data-chart]").forEach(s => { if(s !== svg) hideTip(s); });
  if(svg){ showTip(svg, ev.clientX); return; }
  const h = ev.target.closest && ev.target.closest(".handle"); if(!h) return;
  const li = h.closest(".ed-bloc"); if(!li) return;
  ev.preventDefault();
  try{ h.setPointerCapture(ev.pointerId); }catch(e){}
  drag = {li, h, startY: ev.clientY, id: ev.pointerId, moved: false};
  li.classList.add("dragging");
});
document.addEventListener("pointermove", ev => {
  if(!drag || ev.pointerId !== drag.id) return;
  ev.preventDefault();
  let dy = ev.clientY - drag.startY;
  const li = drag.li, prev = li.previousElementSibling, next = li.nextElementSibling;
  if(next && dy > next.offsetHeight / 2){ const t0 = li.offsetTop; next.after(li); drag.startY += li.offsetTop - t0; drag.moved = true; }
  else if(prev && dy < -prev.offsetHeight / 2){ const t0 = li.offsetTop; prev.before(li); drag.startY += li.offsetTop - t0; drag.moved = true; }
  dy = ev.clientY - drag.startY;
  li.style.transform = "translateY(" + dy + "px)";
}, {passive:false});
function endDrag(ev){
  if(!drag || (ev && ev.pointerId !== drag.id)) return;
  const li = drag.li; li.classList.remove("dragging"); li.style.transform = "";
  const moved = drag.moved; drag = null;
  if(!moved) return;
  const order = [...$("#edBlocs").children].map(x => x.dataset.bid);
  const D = day(edDay);
  D.blocs.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  progChanged(null);
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* Choix d'exercice */
let picker = null;
function openPicker(p){ picker = Object.assign({q:"", filter:"Tous", custom:false}, p); renderPicker(); document.body.classList.add("noscroll"); }
function closePicker(){ picker = null; const s = $("#sheetRoot"); if(s){ s.hidden = true; s.innerHTML = ""; } document.body.classList.remove("noscroll"); }
function allExercises(){ return Object.values(Object.assign({}, LIB, program.custom)).filter(e => !e.hidden); }
function primaryMuscle(e){ const m = e.m || {}; return Object.keys(m).sort((a,b) => m[b] - m[a])[0] || "Autre"; }
function renderPicker(){
  let s = $("#sheetRoot");
  if(!s){ s = document.createElement("div"); s.id = "sheetRoot"; document.body.appendChild(s); }
  s.hidden = false;
  const title = picker.mode === "new" ? "Nouveau module" : picker.mode === "swap" ? "Changer d'exercice" : "Ajouter un exercice";
  const sub = picker.mode === "new" ? "Choisis le premier exercice. Tu pourras en ajouter un 2e et un 3e dans le module." : "Choisis un exercice dans la liste ou crée le tien.";
  s.innerHTML = '<div class="sheet-bg" data-act="pick-close"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+title+'" data-stop="1">'
    + '<div class="sheet-h"><div><h2>'+title+'</h2><p class="side-note">'+sub+'</p></div><button type="button" class="icon-btn" data-act="pick-close" aria-label="Fermer">×</button></div>'
    + '<input type="search" id="pickSearch" placeholder="Rechercher un exercice" value="'+esc(picker.q)+'" autocomplete="off">'
    + '<div class="chips" role="group" aria-label="Muscle">'+["Tous"].concat(MUSCLES).map(m => '<button type="button" data-act="pick-filter" data-m="'+m+'" aria-pressed="'+(picker.filter===m)+'">'+m+'</button>').join("")+'</div>'
    + '<div class="pick-list" id="pickList"></div>'
    + '<div class="custom-form">'+(picker.custom
      ? '<strong>Créer un exercice</strong><input type="text" id="cuName" placeholder="Nom de l\'exercice" autocomplete="off"><select id="cuMuscle" aria-label="Muscle travaillé">'+MUSCLES.map(m => '<option>'+m+'</option>').join("")+'</select><label class="chk"><input type="checkbox" id="cuSide"> Un côté à la fois (bras ou jambe)</label><label class="chk"><input type="checkbox" id="cuZero"> Au poids du corps possible</label><button type="button" class="btn-primary" data-act="cu-create">Créer et ajouter</button><p class="io-msg err" id="cuErr" hidden>Donne un nom à l\'exercice.</p>'
      : '<button type="button" class="btn-add" data-act="cu-open">+ Créer un exercice qui n\'est pas dans la liste</button>')
    + '</div></div></div>';
  renderPickerList();
}
function renderPickerList(){
  const box = $("#pickList"); if(!box || !picker) return;
  const q = picker.q.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const list = allExercises().filter(e => (picker.filter === "Tous" || (e.m && e.m[picker.filter])) && (!q || e.name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").indexOf(q) >= 0));
  list.sort((a,b) => MUSCLES.indexOf(primaryMuscle(a)) - MUSCLES.indexOf(primaryMuscle(b)) || a.name.localeCompare(b.name, "fr"));
  box.innerHTML = list.length ? list.map(e => '<button type="button" data-act="pick" data-id="'+e.id+'"><b>'+esc(e.name)+'</b><span>'+Object.keys(e.m || {}).join(", ")+(e.side ? " · un côté à la fois" : "")+'</span></button>').join("") : '<p class="side-note">Aucun exercice ne correspond. Crée-le ci-dessous.</p>';
}
function pickExercise(id){
  const D = day(edDay);
  const item = {id, sets:3, reps:[8,12], mode:"lourd"};
  item.id = freeId(id);
  if(picker.mode === "new"){ D.blocs.push({id: uid(), rest:[90], edited:true, items:[item]}); progChanged(null); closePicker(); setTimeout(() => { const els = document.querySelectorAll(".ed-bloc"); const last = els[els.length-1]; if(last) last.scrollIntoView({behavior:"smooth", block:"center"}); }, 50); return; }
  const b = D.blocs[picker.bi]; if(!b){ closePicker(); return; }
  if(picker.mode === "add"){ if(distinctBases(b) >= 3){ closePicker(); return; } if(b.emom) item.sets = b.emom; b.items.push(item); }
  if(picker.mode === "swap" && b.items[picker.ii]){
    // Change l'exercice et ses autres séries du même module (1re, 2e série…)
    const oldBase = baseId(b.items[picker.ii].id);
    b.items.forEach((x, k) => { if(baseId(x.id) === oldBase){ const ph = phaseNo(x.id); x.id = "\u0000"; const want = ph > 1 ? id + SEP + ph : id; b.items[k].id = planItems(edDay).some(y => y.id === want) ? freeId(id) : want; delete x.effort; } });
  }
  progChanged(b); closePicker();
}
function createCustom(){
  const name = ($("#cuName").value || "").trim();
  if(!name){ $("#cuErr").hidden = false; return; }
  const id = "c_" + Math.random().toString(36).slice(2, 8);
  program.custom[id] = {id, name, m: {[$("#cuMuscle").value]: 1}, unit:"kg", inc:2.5, cue:"", side: $("#cuSide").checked ? "côté" : undefined, zero: $("#cuZero").checked || undefined};
  saveProgram(); pickExercise(id);
}

/* ===================== Navigation ===================== */
const TABS = ["seance","progres","historique","programme"];
function showTab(name){
  if(TABS.indexOf(name) < 0) name = "seance";
  activeTab = name;
  TABS.forEach(t => { $("#view-"+t).hidden = t !== name; const b = $("#tab-"+t); if(t === name) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(name === "progres") renderProgres();
  if(name === "historique") renderHistorique();
  if(name === "programme") renderProgramme();
  if(name === "seance") renderSeance();
  if(name !== "seance") flush();
  window.scrollTo(0,0);
}
document.addEventListener("click", ev => {
  const tab = ev.target.closest("[data-tab]");
  if(tab){ const n = tab.dataset.tab; try{ history.replaceState(null, "", "#"+n); }catch(e){} showTab(n); return; }
  const a = ev.target.closest("[data-act]"); if(!a) return;
  const act = a.dataset.act;
  if(act === "pick-close"){ if(a.classList.contains("sheet-bg") && ev.target.closest("[data-stop]")) return; closePicker(); return; }
  if(act === "pick-filter"){ picker.filter = a.dataset.m; renderPicker(); return; }
  if(act === "pick"){ pickExercise(a.dataset.id); return; }
  if(act === "cu-open"){ picker.custom = true; renderPicker(); setTimeout(() => { const i = $("#cuName"); if(i) i.focus(); }, 30); return; }
  if(act === "cu-create"){ createCustom(); return; }
  if(activeTab === "programme" && onEditorClick(a)) return;
  if(act === "day"){
    const d = a.dataset.day; if(!current || DAY_KEYS.indexOf(d) < 0 || current.day === d) return;
    current.day = d; applyPlan(current); if(doneAll(current) > 0) scheduleSave(); renderSeance(); window.scrollTo(0,0);
  } else if(act === "edit-day"){ edDay = current ? current.day : edDay; try{ history.replaceState(null, "", "#programme"); }catch(e){} showTab("programme");
  } else if(act === "finish"){
    const m = $("#finishMsg");
    if(!doneAll(current)){ if(m){ m.textContent = "Remplis au moins une série avant de terminer la séance."; m.classList.add("err"); } return; }
    if(!current.finishedAt) current.finishedAt = new Date().toISOString();
    dirty = true; flush();
    if(dirty){ if(m){ m.textContent = "La séance n'a pas pu être enregistrée sur ce téléphone."; m.classList.add("err"); } return; }
    stopTimer(); reviewFinished = false; renderSeance(); window.scrollTo(0,0);
  } else if(act === "review"){ reviewFinished = true; renderSeance(); window.scrollTo(0,0);
  } else if(act === "goto-hist"){ try{ history.replaceState(null, "", "#historique"); }catch(e){} showTab("historique");
  } else if(act === "today"){ openDate(todayIso());
  } else if(act === "rest"){ startTimer(+a.dataset.sec, a.dataset.label);
  } else if(act === "emom"){ startEmom(+a.dataset.min || 5);
  } else if(act === "t-stop"){ stopTimer();
  } else if(act === "t-plus"){ nudge(15);
  } else if(act === "t-minus"){ nudge(-15);
  } else if(act === "fill"){
    const id = a.dataset.exo; const it = itemOf(id); if(!it) return;
    const sg = suggestion(it, lastFor(id, current.date, it.mode)); if(sg.kg == null) return;
    current.exos[id].forEach((s,i) => { if(s.kg == null){ s.kg = sg.kg; const kin = document.getElementById("kg-"+id+"-"+i); if(kin) kin.value = fmtIn(sg.kg); } });
    scheduleSave();
  } else if(act === "open"){
    openDate(a.dataset.date).then(() => { try{ history.replaceState(null, "", "#seance"); }catch(e){} showTab("seance"); });
  } else if(act === "del"){
    const d = a.dataset.date;
    if(pendingDelete === d){ pendingDelete = null; clearTimeout(pendingTimer); deleteSession(d); }
    else { pendingDelete = d; clearTimeout(pendingTimer); pendingTimer = setTimeout(() => { pendingDelete = null; if(activeTab === "historique") renderHistorique(); }, 4000); renderHistorique(); }
  } else if(act === "export"){ exportData();
  } else if(act === "import"){ const f = $("#importFile"); f.value = ""; f.click(); }
});
document.addEventListener("keydown", ev => { if(ev.key === "Escape" && picker) closePicker(); });
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

/* ===================== Démarrage ===================== */
loadProgram();
initStore();
showTab((location.hash || "").replace("#","") || "seance");
})();
</script>
